name: CI Workflow

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch: # Allows manual triggering

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize submodules
        run: git submodule update --init --recursive

      - name: Cache Docker layers
        uses: ScribeMD/docker-cache@0.5.0
        with:
          key: docker-${{ runner.os }}-${{ hashFiles('.github/workflows/test.yml') }}-nvidia-cuda-1232

      - name: Pull CUDA build image
        run: docker pull nvidia/cuda:12.3.2-devel-ubuntu22.04

      - name: Build CuEVM binary inside CUDA container
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/workspace" \
            -w /workspace \
            nvidia/cuda:12.3.2-devel-ubuntu22.04 \
            /bin/bash -lc "set -euo pipefail
              apt-get update
              DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \\
                build-essential \\
                cmake \\
                libcjson-dev \\
                pkg-config
              cmake -S . -B build -DTESTS=OFF -DGPU=ON -DCPU=OFF -DCUDA_COMPUTE_CAPABILITY=86 -DENABLE_EIP_3155_OPTIONAL=OFF -DENABLE_EIP_3155=ON
              cmake --build build -j \$(nproc)
            "

      - name: Verify CuEVM GPU binary artifact
        run: |
          if [ ! -f build/cuevm_GPU ]; then
            echo "cuevm_GPU binary was not produced"
            exit 1
          fi
          if [ ! -x build/cuevm_GPU ]; then
            echo "cuevm_GPU binary is not executable"
            exit 1
          fi
          file build/cuevm_GPU

      - name: Notify Slack on failure
        if: failure()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          if [ -z "${SLACK_WEBHOOK_URL}" ]; then
            echo "SLACK_WEBHOOK_URL is not configured; skipping failure notification."
            exit 0
          fi
          job_url="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          payload=$(printf '{"text":"*CuEVM build failed*\\n\\nWorkflow: %s\\nJob: %s\\nBranch/PR: %s\\nCommit: %s\\nRun ID: %s\\nURL: %s"}' \
            "${GITHUB_WORKFLOW}" \
            "${GITHUB_JOB}" \
            "${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}" \
            "${GITHUB_SHA}" \
            "${GITHUB_RUN_ID}" \
            "${job_url}")
          curl -X POST -H 'Content-type: application/json' --data "${payload}" "${SLACK_WEBHOOK_URL}"
